name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: |
          if [ -f Package.swift ]; then
            swift build
          else
            echo "No Package.swift yet, nothing to build."
          fi

      - name: Test
        run: |
          if [ -f Package.swift ]; then
            swift test
          else
            echo "No Package.swift yet, nothing to test."
          fi

      - name: Package the app
        run: |
          ./scripts/make-app.sh --zip
          lipo -archs build/DriveManager.app/Contents/MacOS/DriveManager
          test -f build/DriveManager.app/Contents/Resources/AppIcon.icns

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: DriveManager
          path: build/DriveManager-*.zip
